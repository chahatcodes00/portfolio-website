<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chahat R. S. Rathour" />

    <!-- Applies the saved theme before first paint so there's no flash of
         the wrong theme on load. Kept tiny and inline (not a module) so it
         runs synchronously, before the stylesheet or React even mount. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* localStorage unavailable (privacy mode, etc.) — default to light */
        }
      })();
    </script>
    <title>Chahat | Personal Portfolio</title>

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Chahat R. S. Rathour - Aspiring Cloud & DevOps Engineer"
    />
    <meta property="og:description" content="Chahat R. S. Rathour" />
    <meta property="og:url" content="https://chahatrsrathour.com.np/" />
    <meta
      property="og:image"
      content="https://chahatrsrathour.com.np/logo.png"
    />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Chahat R. S. Rathour - Aspiring Cloud & DevOps Engineer"
    />
    <meta name="twitter:description" content="Chahat R. S. Rathour" />
    <meta
      name="twitter:image"
      content="https://chahatrsrathour.com.np/logo.png"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://chahatrsrathour.com.np/" />

    <!-- Fonts: Space Grotesk (display), Inter (body), IBM Plex Mono (labels/terminal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
